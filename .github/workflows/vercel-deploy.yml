name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
      - staging
      - dev

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Pull Vercel Production Environment
        run: npx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts (Production)
        run: npx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel (Production)
        run: |
          mv .git /tmp/repo.git
          trap 'mv /tmp/repo.git .git 2>/dev/null || true' EXIT
          npx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Create Sentry Releases & Deploys (Production)
        if: env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v3
        env:
          SENTRY_ORG: hubbleflow-labs
        with:
          environment: production
          release: ${{ github.sha }}
          projects: kiyo-frontend kiyo-backend
          set_commits: auto

  deploy-staging:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Pull Vercel Staging Environment
        run: npx vercel@latest pull --yes --environment=preview --git-branch=staging --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts (Staging)
        run: npx vercel@latest build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel (Staging) & Alias
        run: |
          mv .git /tmp/repo.git
          trap 'mv /tmp/repo.git .git 2>/dev/null || true' EXIT
          DEPLOY_URL=$(npx vercel@latest deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed staging preview: $DEPLOY_URL"
          npx vercel@latest alias set "$DEPLOY_URL" staging.kiyostores.space --token=${{ secrets.VERCEL_TOKEN }}

      - name: Create Sentry Releases & Deploys (Staging)
        if: env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v3
        env:
          SENTRY_ORG: hubbleflow-labs
        with:
          environment: staging
          release: ${{ github.sha }}
          projects: kiyo-frontend kiyo-backend
          set_commits: auto
